<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>위험한 미국사</title>
    <style>
        body {
            font-family: 'Noto Sans KR', Arial, sans-serif;
            background: #f6f7f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 32px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 24px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #2c3e50;
            text-align: center;
        }

        .book-info {
            font-size: 1rem;
            color: #6c757d;
            text-align: center;
            margin-bottom: 24px;
        }

        .review {
            line-height: 1.7;
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        @media (max-width: 700px) {
            .container {
                margin: 16px;
                padding: 16px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .review {
                font-size: 1rem;
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <h1>위험한 미국사</h1>
        <div class="book-info">
            저자: <strong>김봉중</strong>
        </div>
        <div class="book-info">
            작성 날짜: <strong>2026년 3월 5일</strong>
        </div>
    </div>

    <div class="container">
        <h2>트럼프 2기의 탄생 배경과 역사</h2>

        <p class="review">
            트럼프는 전통적인 미국의 정치 스타일에서 크게 벗어난 사람이라고 평가 되고, MAGA로 대표되는 트럼프의 지지자들은 그러한 이탈을 적극 환영하고 있다. 남북전쟁 이래로 매번 정치 변화의 주도권에서 벗어나 있던 미국 남부, 세계화와 금융 자본주의의 성숙으로 인해 몰락한 백인 노동자 계층, 그리고 미국의 정치 엘리트에게 신물이 난 사람들이다. 
        </p>

        
    </div>

    

    
</body>

</html>
